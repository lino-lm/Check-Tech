<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CheckTech - Cadastro Professor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

     <main class="auth-container">

        <section class="auth-card">

            <img
                src="{{ url_for('static', filename='img/logo.jpeg') }}"
                alt="CheckTech"
                class="logo"
            >

            <h1>
                Criar conta de professor
            </h1>

            <p class="subtitle">
                Cadastre seu acesso ao Hub do Professor.
            </p>


            <form id="professorCadastroForm">

                <div class="input-group">

                    <label for="professorNome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="professorNome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="professorCadastroEmail">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="professorCadastroEmail"
                        placeholder="seu.email@prof.educacao.sp.gov.br"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="professorCadastroSenha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="professorCadastroSenha"
                        placeholder="Mínimo de 6 caracteres"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="professorCodigo">
                        Código de acesso
                    </label>

                    <input
                        type="password"
                        id="professorCodigo"
                        placeholder="Código fornecido pela escola"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Criar conta
                </button>

            </form>


            <div class="auth-links">

                <button
                    type="button"
                    class="text-button"
                    onclick="voltarLoginProfessor()"
                >
                    ← Voltar para login do professor
                </button>

            </div>

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
