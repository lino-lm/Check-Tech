<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CheckTech - Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <img
                src="{{ url_for('static', filename='img/logo.jpeg') }}"
                alt="CheckTech"
                class="logo"
            >

            <h1>Criar conta</h1>

            <p class="subtitle">
                Cadastre-se para utilizar o CheckTech.
            </p>


            <form id="cadastroForm">

                <div class="input-group">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="emailCadastro">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="emailCadastro"
                        placeholder="seuemail@al.educacao.sp.gov.br"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="senhaCadastro">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaCadastro"
                        placeholder="Mínimo de 6 caracteres"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="serieCadastro">
                        Série
                    </label>

                    <select id="serieCadastro" required>

                        <option value="">
                            Selecione sua série
                        </option>

                        <option value="2D1">2D1</option>
                        <option value="2D2">2D2</option>
                        <option value="2D3">2D3</option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Criar conta
                </button>

            </form>


            <div id="cadastroMessage" class="message"></div>


            <button
                type="button"
                class="text-button"
                onclick="voltarLogin()"
            >
                Já tenho uma conta
            </button>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
